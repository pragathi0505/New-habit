name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -sSfL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
          unzip -q /tmp/gradle-9.3.1.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk DailyHabit-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyHabit-debug-apk
          path: DailyHabit-debug.apk

      - name: Publish Debug APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view debug-apk >/dev/null 2>&1; then
            gh release upload debug-apk DailyHabit-debug.apk --clobber
          else
            gh release create debug-apk DailyHabit-debug.apk \
              --title "DailyHabit Debug APK" \
              --notes "Latest installable debug APK built automatically from ${{ github.sha }}." \
              --prerelease
          fi
